deptrac:
  paths:
    - ./src
    - ./app
  exclude_files:
    - '#.*test.*#i'

  layers:
    - name: Domain
      collectors:
        - type: bool
          must:
            - type: classLike
              value: SIIM\\Domain\\.*
          must_not:
            - type: classLike
              value: SIIM\\Domain\\(Identity|Citizen|Ingestion|Analysis|Conversation|Reporting)\\.*

    - name: Application
      collectors:
        - type: classLike
          value: SIIM\\Application\\.*

    - name: Infrastructure
      collectors:
        - type: classLike
          value: SIIM\\Infrastructure\\.*

    - name: Http
      collectors:
        - type: classLike
          value: App\\Http\\.*

    - name: SharedKernel
      collectors:
        - type: classLike
          value: SIIM\\Application\\Shared\\.*

    - name: Context_Identity
      collectors:
        - type: classLike
          value: SIIM\\(Domain|Application)\\Identity\\.*

    - name: Context_Citizen
      collectors:
        - type: classLike
          value: SIIM\\(Domain|Application)\\Citizen\\.*

    - name: Context_Ingestion
      collectors:
        - type: classLike
          value: SIIM\\(Domain|Application)\\Ingestion\\.*

    - name: Context_Analysis
      collectors:
        - type: classLike
          value: SIIM\\(Domain|Application)\\Analysis\\.*

    - name: Context_Conversation
      collectors:
        - type: classLike
          value: SIIM\\(Domain|Application)\\Conversation\\.*

    - name: Context_Reporting
      collectors:
        - type: classLike
          value: SIIM\\(Domain|Application)\\Reporting\\.*

  ruleset:
    Domain:
      - Domain
    Application:
      - Application
      - Domain
      - SharedKernel
      - Context_Identity
      - Context_Citizen
      - Context_Ingestion
      - Context_Analysis
      - Context_Conversation
      - Context_Reporting
    Infrastructure:
      - Infrastructure
      - Application
      - Domain
      - SharedKernel
      - Context_Identity
      - Context_Citizen
      - Context_Ingestion
      - Context_Analysis
      - Context_Conversation
      - Context_Reporting
    Http:
      - Http
      - Application
      - SharedKernel
      - Context_Identity
      - Context_Citizen
      - Context_Ingestion
      - Context_Analysis
      - Context_Conversation
      - Context_Reporting
    SharedKernel:
      - SharedKernel
      - Application
      - Domain

    Context_Identity:
      - Context_Identity
      - Application
      - Domain
      - SharedKernel
    Context_Citizen:
      - Context_Citizen
      - Application
      - Domain
      - SharedKernel
    Context_Ingestion:
      - Context_Ingestion
      - Application
      - Domain
      - SharedKernel
    Context_Analysis:
      - Context_Analysis
      - Application
      - Domain
      - SharedKernel
    Context_Conversation:
      - Context_Conversation
      - Application
      - Domain
      - SharedKernel
    Context_Reporting:
      - Context_Reporting
      - Application
      - Domain
      - SharedKernel
