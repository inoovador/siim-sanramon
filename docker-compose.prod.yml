# Deploy with: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
services:
  siim-prod:
    build:
      context: .
      dockerfile: siim/Dockerfile.production
    image: siim:production
    container_name: siim-prod
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      ASSET_URL: ${ASSET_URL}
      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      APP_TIMEZONE: ${APP_TIMEZONE}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-120}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      LLM_PRIMARY: ${LLM_PRIMARY}
      LLM_FALLBACK: ${LLM_FALLBACK}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
      NVIDIA_VERIFY_SSL: ${NVIDIA_VERIFY_SSL}
    depends_on:
      siim-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.siim-http.rule=Host(`siim-sanramon.duckdns.org`)
      - traefik.http.routers.siim-http.entrypoints=http
      - traefik.http.routers.siim-http.middlewares=siim-https-redirect
      - traefik.http.middlewares.siim-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.siim-https.rule=Host(`siim-sanramon.duckdns.org`)
      - traefik.http.routers.siim-https.entrypoints=https
      - traefik.http.routers.siim-https.tls=true
      - traefik.http.routers.siim-https.tls.certresolver=letsencrypt
      - traefik.http.services.siim.loadbalancer.server.port=8080
    networks:
      - coolify
      - siim-backend

  siim-db:
    image: mariadb:11.4
    container_name: siim-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - siim-db-data:/var/lib/mysql
    networks:
      - siim-backend

  siim-worker:
    image: siim:production
    container_name: siim-worker
    restart: unless-stopped
    healthcheck: { disable: true }
    command: php artisan queue:work --queue=analysis,default --tries=4 --timeout=90 --sleep=3 --max-time=3600
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      ASSET_URL: ${ASSET_URL}
      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      APP_TIMEZONE: ${APP_TIMEZONE}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-120}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      LLM_PRIMARY: ${LLM_PRIMARY}
      LLM_FALLBACK: ${LLM_FALLBACK}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
      NVIDIA_VERIFY_SSL: ${NVIDIA_VERIFY_SSL}
    depends_on:
      siim-db:
        condition: service_healthy
    networks:
      - siim-backend

volumes:
  siim-db-data:

networks:
  siim-backend:
    name: siim-backend
    driver: bridge
    internal: false
  coolify:
    external: true
    name: coolify
